<!DOCTYPE html>
<html lang="en">

<head>
  <title>T10-input from HTML</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- stylesheets *******************************************-->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/dtec_favicon.png">
</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <h1>T10-input from HTML</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>

  <p><br><br><i>Copy your HTML from the last task and keep building.</i><br><br><br><br></p>
  <form onsubmit="return false;">
    <label for="nameField">Enter your name:</label>
    <input type = "text" id="nameField" name="formName" value="Name">
    <input type = "submit" onClick="getFormInput()">
  </form>
  <form onsubmit="return false">
    <label for="ageField">Enter your age:</label>
    <input type = "text" id="ageField" name="formAge" value="Age">
    <input type = "submit" onClick="getAge()">
  </form> 

  <form onsubmit="return false">
    <label for="pocketMoneyField">Enter your pocket money:</label>
    <input type = "text" id="pocketMoneyField" name="userPocketMoney" >
    <input type = "submit" onClick="getUserPocketMoney()">
  </form>
  <form onsubmit="return false">
    <label for="changeField">Enter your change:</label>
    <input type = "text" id="changeField" name="userChange" >
    <input type = "submit" onClick="givenChange()">
  </form>
  <form onsubmit="return false">
    <label for="chocolateOpinionField">How much do you like chocolate out of 0-3?</label>
    <input type = "text" id="chocolateOpinionField" name="userChocolateOpinion" >
    <input type = "submit" onClick="chocolateOpinion()">
  </form>
    
  <div id="spaceForJavaScriptOutput">

    The output of your script will go here.

  </div>


  <script src="../t16_arrays_continued.js"></script>

</body>

</html>
